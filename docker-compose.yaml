version: '3.8'
services:
  thermal_up_server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:5005"  # Маппинг внешнего порта 5005 на внутренний 5005
    environment:
      - SERVER_HOST=0.0.0.0
      - DB_HOST=thermal_up_db  # Имя сервиса базы данных в сети Docker
      - DB_PORT=5432  # Внутренний порт PostgreSQL внутри контейнера
      - DB_USER=postgres
      - DB_PASSWORD=ThermalUpPGPass
      - DB_NAME=postgres
    depends_on:
      - thermal_up_db
    networks:
      - thermal_up_network

  thermal_up_db:
    image: postgres:14
    ports:
      - "3110:5432"  # Маппинг внешнего порта 3100 на внутренний 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ThermalUpPGPass
      - POSTGRES_DB=postgres
    volumes:
      - D:\@Projects\@Python_Projects\PNI_server\PGData:/var/lib/postgresql/data
    networks:
      - thermal_up_network

networks:
  thermal_up_network:
    driver: bridge